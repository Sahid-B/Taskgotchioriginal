services:
  postgres:
    image: postgres:16
    container_name: taskgotchi-postgres
    environment:
      POSTGRES_DB: taskgotchidb
      POSTGRES_USER: taskgotchi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taskgotchi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskgotchi -d taskgotchidb"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  taskgotchi-data:
    name: proyecto_taskgotchi-data
